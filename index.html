<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LapChat</title>

<style>
/* ===== RESET ===== */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0b141a;
  color: #fff;
}

/* ===== LOGIN ===== */
#login {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 20px;
}

#login h1 {
  text-align: center;
  margin-bottom: 20px;
}

#login input {
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  outline: none;
  margin-bottom: 10px;
}

#login button {
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  background: #00a884;
  color: white;
  cursor: pointer;
}

/* ===== CHAT ===== */
#chat {
  display: none;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* header */
#header {
  padding: 12px;
  background: #202c33;
  display: flex;
  flex-direction: column;
}

#header .name {
  font-weight: bold;
}

#header .status {
  font-size: 12px;
  color: #9aa2a6;
}

/* messages */
#messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

/* bubble */
.message {
  max-width: 75%;
  padding: 8px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 14px;
}

.me {
  background: #005c4b;
  margin-left: auto;
  border-bottom-right-radius: 0;
}

.other {
  background: #202c33;
  margin-right: auto;
  border-bottom-left-radius: 0;
}

.message .time {
  font-size: 10px;
  color: #ccc;
  text-align: right;
  margin-top: 4px;
}

/* typing */
#typing {
  font-size: 12px;
  color: #9aa2a6;
  padding: 0 10px 5px;
}

/* input */
#inputBar {
  display: flex;
  padding: 10px;
  background: #202c33;
}

#inputBar input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
}

#inputBar button {
  margin-left: 8px;
  padding: 12px 16px;
  border-radius: 50%;
  border: none;
  background: #00a884;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>LapChat</h1>
  <input id="username" placeholder="Masukin username">
  <button onclick="login()">Masuk</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="header">
    <div class="name">LapChat</div>
    <div class="status" id="onlineStatus">online</div>
  </div>

  <div id="messages"></div>
  <div id="typing"></div>

  <div id="inputBar">
    <input id="text" placeholder="Ketik pesan...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script type="module">
/* ===== FIREBASE ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBVJAihlYHvy2IZOwg_qQ0WPgP1AdYrHxQ",
  authDomain: "lapchat-6cb5e.firebaseapp.com",
  databaseURL: "https://lapchat-6cb5e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lapchat-6cb5e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== STATE ===== */
let myName = "";
let typingTimeout;

/* ===== LOGIN ===== */
window.login = () => {
  myName = username.value.trim();
  if (!myName) return alert("Username kosong");

  login.style.display = "none";
  chat.style.display = "flex";

  set(ref(db, "status/" + myName), {
    online: true,
    typing: false
  });
};

/* ===== SEND MESSAGE ===== */
window.send = () => {
  if (!text.value) return;

  push(ref(db, "messages"), {
    name: myName,
    text: text.value,
    time: Date.now()
  });

  text.value = "";
  set(ref(db, "typing/" + myName), false);
};

/* ===== LISTEN MESSAGE ===== */
onChildAdded(ref(db, "messages"), snap => {
  const d = snap.val();
  const div = document.createElement("div");

  div.className = "message " + (d.name === myName ? "me" : "other");
  div.innerHTML = `
    <div>${d.text}</div>
    <div class="time">${new Date(d.time).toLocaleTimeString()}</div>
  `;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});

/* ===== TYPING ===== */
text.addEventListener("input", () => {
  set(ref(db, "typing/" + myName), true);
  clearTimeout(typingTimeout);

  typingTimeout = setTimeout(() => {
    set(ref(db, "typing/" + myName), false);
  }, 1000);
});

onValue(ref(db, "typing"), snap => {
  const data = snap.val() || {};
  const someoneTyping = Object.keys(data).find(
    n => data[n] && n !== myName
  );

  typing.textContent = someoneTyping
    ? someoneTyping + " lagi ngetik..."
    : "";
});

/* ===== ONLINE STATUS ===== */
onValue(ref(db, "status"), snap => {
  const data = snap.val() || {};
  const onlineCount = Object.values(data).filter(u => u.online).length;
  onlineStatus.textContent = onlineCount + " online";
});
</script>

</body>
</html>
