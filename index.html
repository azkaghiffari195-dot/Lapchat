<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LapChat Rooms</title>

<style>
:root {
  --bg: #0b141a;
  --panel: #202c33;
  --me: #005c4b;
  --other: #2a3942;
  --text: #ffffff;
}

.light {
  --bg: #f0f0f0;
  --panel: #ffffff;
  --me: #dcf8c6;
  --other: #eeeeee;
  --text: #000000;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ===== screens ===== */
.screen {
  display: none;
  height: 100vh;
  padding: 20px;
}
.screen.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* ===== inputs & buttons ===== */
input, button {
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}

button {
  background: #00a884;
  color: white;
  cursor: pointer;
}

/* ===== chat ===== */
#chatScreen {
  padding: 0;
}

#header {
  background: var(--panel);
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#header button {
  background: none;
  color: var(--text);
  font-size: 14px;
}

#messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.msg {
  max-width: 75%;
  padding: 8px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}

.me {
  background: var(--me);
  margin-left: auto;
}

.other {
  background: var(--other);
}

#inputBar {
  display: flex;
  padding: 10px;
  background: var(--panel);
}

#inputBar input {
  flex: 1;
  border-radius: 20px;
  border: none;
  padding: 12px;
}

#inputBar button {
  margin-left: 8px;
  border-radius: 50%;
}

/* ===== popup ===== */
#popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  justify-content: center;
  align-items: center;
}

#popupContent {
  background: var(--panel);
  padding: 20px;
  border-radius: 10px;
  width: 80%;
  max-width: 300px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <h2>LapChat</h2>
  <input id="username" placeholder="Username">
  <button onclick="saveName()">Lanjut</button>
</div>

<!-- MENU -->
<div id="menuScreen" class="screen">
  <button onclick="createRoom()">➕ Make New Chat</button>
  <input id="roomInput" placeholder="Kode Room (6 angka)">
  <button onclick="joinRoom()">🔑 Join Chat</button>
</div>

<!-- CHAT -->
<div id="chatScreen" class="screen">
  <div id="header">
    <div>Room <span id="roomCode"></span></div>
    <div>
      <button onclick="toggleTheme()">🌙</button>
      <button onclick="showMembers()">👥</button>
      <button onclick="leaveRoom()">🚪</button>
    </div>
  </div>

  <div id="messages"></div>

  <div id="inputBar">
    <input id="text" placeholder="Ketik pesan...">
    <button onclick="send()">➤</button>
  </div>
</div>

<!-- POPUP -->
<div id="popup">
  <div id="popupContent">
    <h3>Online</h3>
    <div id="memberList"></div>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  set,
  remove,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBVJAihlYHvy2IZOwg_qQ0WPgP1AdYrHxQ",
  authDomain: "lapchat-6cb5e.firebaseapp.com",
  databaseURL: "https://lapchat-6cb5e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lapchat-6cb5e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myName = "";
let currentRoom = "";

/* ===== THEME ===== */
const savedTheme = localStorage.getItem("theme");
if (savedTheme === "light") document.body.classList.add("light");

window.toggleTheme = () => {
  document.body.classList.toggle("light");
  localStorage.setItem(
    "theme",
    document.body.classList.contains("light") ? "light" : "dark"
  );
};

/* ===== NAV ===== */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ===== LOGIN ===== */
window.saveName = () => {
  myName = username.value.trim();
  if (!myName) return alert("Isi username");
  show("menuScreen");
};

/* ===== ROOM ===== */
window.createRoom = () => {
  currentRoom = Math.floor(100000 + Math.random() * 900000).toString();
  enterRoom();
};

window.joinRoom = () => {
  const code = roomInput.value.trim();
  if (code.length !== 6) return alert("Kode salah");
  currentRoom = code;
  enterRoom();
};

function enterRoom() {
  roomCode.textContent = currentRoom;
  messages.innerHTML = "";
  show("chatScreen");

  const msgRef = ref(db, `rooms/${currentRoom}/messages`);
  onChildAdded(msgRef, snap => {
    const d = snap.val();
    const div = document.createElement("div");
    div.className = "msg " + (d.name === myName ? "me" : "other");
    div.textContent = d.name + ": " + d.text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });

  const userRef = ref(db, `rooms/${currentRoom}/users/${myName}`);
  set(userRef, true);
  onDisconnect(userRef).remove();

  onValue(ref(db, `rooms/${currentRoom}/users`), snap => {
    const users = snap.val() || {};
    memberList.innerHTML = Object.keys(users)
      .map(u => "• " + u)
      .join("<br>");
  });
}

/* ===== CHAT ===== */
window.send = () => {
  if (!text.value) return;
  push(ref(db, `rooms/${currentRoom}/messages`), {
    name: myName,
    text: text.value,
    time: Date.now()
  });
  text.value = "";
};

/* ===== POPUP ===== */
window.showMembers = () => popup.style.display = "flex";
window.closePopup = () => popup.style.display = "none";

/* ===== LEAVE ===== */
window.leaveRoom = () => {
  remove(ref(db, `rooms/${currentRoom}/users/${myName}`));
  currentRoom = "";
  show("menuScreen");
};
</script>

</body>
</html>
