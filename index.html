<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LapChat</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0b141a;
  color: white;
}

/* ===== LOGIN ===== */
#login {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 20px;
}

#login h1 {
  text-align: center;
  margin-bottom: 20px;
}

#login input, #login button {
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
}

/* ===== CHAT ===== */
#chat {
  display: none;
  height: 100vh;
  flex-direction: column;
}

/* header */
#header {
  background: #202c33;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#header button {
  background: #ff5555;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

/* messages */
#messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.message {
  max-width: 75%;
  padding: 8px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 14px;
}

.me {
  background: #005c4b;
  margin-left: auto;
}

.other {
  background: #202c33;
  margin-right: auto;
}

/* input */
#inputBar {
  display: flex;
  padding: 10px;
  background: #202c33;
}

#inputBar input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
}

#inputBar button {
  margin-left: 8px;
  padding: 12px 16px;
  border-radius: 50%;
  border: none;
  background: #00a884;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>LapChat</h1>
  <input id="username" placeholder="Username">
  <button onclick="login()">Masuk</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="header">
    <div id="roomInfo">Chat room</div>
    <button onclick="clearChat()">Clear</button>
  </div>

  <div id="messages"></div>

  <div id="inputBar">
    <input id="text" placeholder="Ketik pesan...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  remove
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

/* ===== CONFIG ===== */
const firebaseConfig = {
  apiKey: "API_KEY_KAMU",
  authDomain: "lapchat-6cb5e.firebaseapp.com",
  databaseURL: "https://lapchat-6cb5e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lapchat-6cb5e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== STATE ===== */
let myName = localStorage.getItem("lapchat_name") || "";

/* ===== AUTO LOGIN ===== */
if (myName) {
  showChat();
}

/* ===== FUNCTIONS ===== */
window.login = () => {
  const name = username.value.trim();
  if (!name) return alert("Isi username");

  myName = name;
  localStorage.setItem("lapchat_name", myName);
  showChat();
};

function showChat() {
  login.style.display = "none";
  chat.style.display = "flex";
}

/* ===== SEND MESSAGE ===== */
window.send = () => {
  if (!text.value) return;

  push(ref(db, "messages"), {
    name: myName,
    text: text.value,
    time: Date.now()
  });

  text.value = "";
};

/* ===== LISTEN MESSAGE (MULTI USER) ===== */
onChildAdded(ref(db, "messages"), snap => {
  const d = snap.val();
  const div = document.createElement("div");

  div.className = "message " + (d.name === myName ? "me" : "other");
  div.textContent = d.name + ": " + d.text;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});

/* ===== CLEAR CHAT ===== */
window.clearChat = () => {
  if (!confirm("Hapus semua chat?")) return;
  remove(ref(db, "messages"));
  messages.innerHTML = "";
};
</script>

</body>
</html>
