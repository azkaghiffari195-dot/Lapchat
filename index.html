<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LapChat Rooms</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0b141a;
  color: white;
}

/* screens */
.screen {
  display: none;
  height: 100vh;
  padding: 20px;
}
.screen.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* buttons */
button {
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  background: #00a884;
  color: white;
  cursor: pointer;
  margin-top: 10px;
}

input {
  padding: 14px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}

/* chat */
#chatScreen {
  padding: 0;
}

#header {
  background: #202c33;
  padding: 10px;
  text-align: center;
}

#messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.msg {
  max-width: 75%;
  padding: 8px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}

.me {
  background: #005c4b;
  margin-left: auto;
}

.other {
  background: #202c33;
}

#inputBar {
  display: flex;
  padding: 10px;
  background: #202c33;
}

#inputBar input {
  flex: 1;
  border-radius: 20px;
  border: none;
  padding: 12px;
}

#inputBar button {
  margin-left: 8px;
  border-radius: 50%;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <h2>LapChat</h2>
  <input id="username" placeholder="Username">
  <button onclick="saveName()">Lanjut</button>
</div>

<!-- MENU -->
<div id="menuScreen" class="screen">
  <h3>Pilih</h3>
  <button onclick="createRoom()">➕ Make New Chat</button>
  <input id="roomInput" placeholder="Kode Room (6 angka)">
  <button onclick="joinRoom()">🔑 Join Chat</button>
</div>

<!-- CHAT -->
<div id="chatScreen" class="screen">
  <div id="header">Room: <span id="roomCode"></span></div>
  <div id="messages"></div>
  <div id="inputBar">
    <input id="text" placeholder="Ketik pesan...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBVJAihlYHvy2IZOwg_qQ0WPgP1AdYrHxQ",
  authDomain: "lapchat-6cb5e.firebaseapp.com",
  databaseURL: "https://lapchat-6cb5e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lapchat-6cb5e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myName = "";
let currentRoom = "";

/* helpers */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* login */
window.saveName = () => {
  myName = username.value.trim();
  if (!myName) return alert("Isi username");
  show("menuScreen");
};

/* room */
window.createRoom = () => {
  currentRoom = Math.floor(100000 + Math.random() * 900000).toString();
  enterRoom();
};

window.joinRoom = () => {
  const code = roomInput.value.trim();
  if (code.length !== 6) return alert("Kode harus 6 angka");
  currentRoom = code;
  enterRoom();
};

function enterRoom() {
  roomCode.textContent = currentRoom;
  messages.innerHTML = "";
  show("chatScreen");

  const msgRef = ref(db, "rooms/" + currentRoom + "/messages");
  onChildAdded(msgRef, snap => {
    const d = snap.val();
    const div = document.createElement("div");
    div.className = "msg " + (d.name === myName ? "me" : "other");
    div.textContent = d.name + ": " + d.text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
}

/* send */
window.send = () => {
  if (!text.value) return;
  push(ref(db, "rooms/" + currentRoom + "/messages"), {
    name: myName,
    text: text.value,
    time: Date.now()
  });
  text.value = "";
};
</script>

</body>
</html>
